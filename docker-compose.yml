services:
  postgres:
    image: postgres:16
    container_name: alpha_cinema_postgres
    restart: always
    environment:
      POSTGRES_DB: alpha_cinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - alpha_cinema_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: alpha_cinema_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  alpha_cinema_postgres_data:
